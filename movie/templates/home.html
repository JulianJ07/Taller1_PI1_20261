<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Reviews</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
</head>
<body>

  <div class="container mt-4">
    <h1>{{ name }}</h1>

    <form action="">
      <div class="mb-3">
        <label for="searchMovie" class="form-label">Search for Movie:</label>
        <input type="text" class="form-control" name="searchMovie" id="searchMovie" />
      </div>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <p class="mt-3">Searching for {{ searchTerm }}</p>

    {% for movie in movies %}
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="card-title">{{ movie.title }}</h2>
          <h5 class="card-text">{{ movie.description }}</h5>

          {% if movie.image %}
            <img src="{{ movie.image.url }}" alt="{{ movie.title }}" class="img-fluid mb-2">
          {% endif %}

          {% if movie.url %}
            <br>
            <a href="{{ movie.url }}" class="btn btn-outline-secondary">Movie Link</a>
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>

</body>
</html>
